<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Досье клиента — Tamyr</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
<style>
  body { display: block; overflow: auto; }
  .d-top { position: sticky; top: 0; z-index: 10; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 20px 60px; }
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .hero .kicker { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .hero h1 { font: 700 26px var(--mono); margin: 6px 0 10px; letter-spacing: .02em; }
  .hero .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .hero .evid { color: var(--ink-2); margin-top: 12px; max-width: 760px; font-size: 13.5px; }
  .prio { text-align: right; }
  .prio .big { font: 700 44px var(--mono); color: var(--accent); line-height: 1; }
  .prio small { display: block; color: var(--muted); margin-top: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 18px 0; }
  .kpi { background: var(--panel); padding: 12px 14px; }
  .kpi small { color: var(--muted); font-size: 11.5px; display: block; }
  .kpi b { font: 600 19px var(--mono); display: block; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi i { font-style: normal; font-size: 11.5px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .box h2 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
  .box .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; }
  .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
  svg text { font-family: var(--font); }
  svg .lbl { fill: var(--ink-2); font-size: 11px; }
  svg .val { fill: var(--ink); font: 11px var(--mono); }
  svg .mut { fill: var(--muted); font-size: 10.5px; }
  svg .axis { stroke: var(--line-2); }
  svg .gl { stroke: var(--line); }
  [data-tip] { cursor: default; }
  .lg { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-2); margin: 4px 0 8px; flex-wrap: wrap; }
  .lg span { display: flex; align-items: center; gap: 6px; }
  .lg i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .signals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sig { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--panel-2); }
  .sig.on { border-color: rgba(240,180,41,.55); background: rgba(240,180,41,.06); }
  .sig .h { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
  .sig .h em { font-style: normal; font: 600 10px var(--mono); padding: 1px 5px; border-radius: 3px; background: var(--panel-3); color: var(--muted); }
  .sig.on .h em { background: var(--accent); color: #111; }
  .sig b { display: block; font: 600 15px var(--mono); margin-top: 6px; }
  .sig small { color: var(--muted); font-size: 11px; }
  .ladder { display: flex; align-items: center; gap: 0; margin: 10px 0 6px; }
  .ladder .st { flex: 1; text-align: center; font-size: 11px; color: var(--muted); position: relative; padding-top: 22px; }
  .ladder .st::before { content: ""; position: absolute; top: 8px; left: 0; right: 0; height: 2px; background: var(--line-2); }
  .ladder .st::after { content: ""; position: absolute; top: 3px; left: calc(50% - 6px); width: 12px; height: 12px; border-radius: 50%; background: var(--panel-3); border: 2px solid var(--line-2); }
  .ladder .st.me::after { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(240,180,41,.2); }
  .ladder .st.me { color: var(--ink); font-weight: 600; }
  ul.recs { margin: 0; padding-left: 18px; color: var(--ink-2); }
  ul.recs li { margin-bottom: 6px; }
  .mono { font-family: var(--mono); }
  .disc { color: var(--muted); font-size: 11.5px; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid > * { grid-column: span 12 !important; } .signals { grid-template-columns: repeat(2, 1fr); } }
  @media print {
    :root { --bg: #fff; --panel: #fff; --panel-2: #f6f7f9; --panel-3: #eceef2; --line: #dfe2e7; --line-2: #c9ced6; --ink: #111; --ink-2: #333; --muted: #666; --dim: #888; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .topbar .btn, .d-top .search { display: none; }
    .box { break-inside: avoid; }
    .wrap { padding: 0; }
    .kpis { grid-template-columns: repeat(3, 1fr) !important; }
    .signals { grid-template-columns: repeat(2, 1fr) !important; }
  }
</style>
</head>
<body>
<header class="topbar d-top">
  <a class="brand" href="/"><img src="logo.svg" alt="" width="28" height="28"><span class="word">TAMYR</span><span class="sub">Досье клиента</span></a>
  <span class="chip" style="margin-left:auto">Для служебного пользования · гипотезы для проверки</span>
  <a class="btn ghost" id="to-report" href="#">Текстовая справка</a>
  <button class="btn accent" id="btn-print">Печать / PDF</button>
</header>
<div class="wrap" id="root"><div class="note">Загрузка…</div></div>
<div id="tip" class="tip hidden"></div>
<script src="net.js"></script>
<script src="dossier.js"></script>
</body>
</html>
