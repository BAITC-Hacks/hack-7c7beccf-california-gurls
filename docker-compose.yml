services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moneygraph
    volumes:
      - pgdata:/var/lib/postgresql/data   # отметки аналитика переживают перезапуск
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/moneygraph
    env_file:
      - path: .env
        required: false        # без .env всё работает, кроме AI-ассистента
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./output:/app/output

volumes:
  pgdata:
