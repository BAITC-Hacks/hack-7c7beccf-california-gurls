# Все пороги и веса — здесь. Меняем пороги только тут, код не трогаем.

data_dir: data
out_dir: output
truncation_depth: 4          # колено, на котором обход оборван (исходящие не выгружались)
fast_days: 2                 # «сквозной транзит»: деньги ушли дальше за N дней

roles:
  coordinator:               # (а) собирает И раздаёт: одновременно признаки консолидации и распределения
    min_in_deg: 5
    min_out_deg: 10
    # (б) сборщик второго уровня: консолидатор, которому платят другие хабы (coordinator/consolidator/distributor)
    min_hub_payers: 6
    min_seed_reach: 5
  distributor:               # веерная рассылка
    min_out_deg: 10
  consolidator:              # сбор с нескольких плательщиков
    min_in_deg: 5
  transit:                   # пропускает дальше, не удерживая
    pass_ratio_min: 0.8
    pass_ratio_max: 1.2
    min_in_sum: 50000
  terminal:                  # деньги пришли и остались (только если исходящие реально наблюдаемы)
    max_pass_ratio: 0.2
    min_in_sum: 200000       # иначе — разовый мелкий получатель → peripheral
    or_min_in_deg: 2
  use_boundary_role: true    # доп. роль для узлов 4-го колена (исходящие не выгружались)

priority:
  role_weight:
    coordinator: 1.0
    consolidator: 0.85
    distributor: 0.8
    transit: 0.6
    terminal: 0.45
    boundary: 0.3
    peripheral: 0.1
  weights:                   # сумма = 1
    role: 0.35
    money: 0.25
    seed_exposure: 0.2
    centrality: 0.2
  seed_multiplier: 0.75      # seed уже известны правоохранителям — фокус на тех, кто выше

clustering:
  resolution: 1.0
  seed: 42

top_n: 30
splitting:                   # дробление: один перевод разбит на несколько платежей за день
  min_tx_per_day: 3          # ≥N переводов между одной парой в один день = эпизод дробления
  near_threshold_max: 10000  # «у порога»: сумма 5 000–10 000 ₸ (ниже 5 000 в выгрузку не попадает)
stability:                   # устойчивость роли: пересчёт с порогами ×U(1-spread, 1+spread)
  runs: 60
  spread: 0.2
  seed: 7
anomaly:                     # аномальный профиль относительно своего колена (robust z по log-шкале)
  z_threshold: 2.5
  min_scale: 0.5
routes:                      # повторяющиеся маршруты A→B→C
  max_gap_days: 3            # B переводит C не позже чем через N дней после A→B
  min_repeats: 3             # маршрут повторился в ≥K разных дней
burst:                       # всплеск: ≥60% месячного оборота в один день при ≥3 активных днях
  min_share: 0.6
  min_active_days: 3
max_cycle_len: 4             # поиск возвратных потоков A→B→…→A длиной до N
next_requests_n: 40          # сколько рекомендаций «что запросить дальше»
