<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Справка — Tamyr</title>
<style>
  @page { size: A4; margin: 16mm 14mm; }
  * { box-sizing: border-box; }
  body { font: 11.5px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #111; margin: 0; background: #e9ebef; }
  .sheet { max-width: 800px; margin: 20px auto; background: #fff; padding: 36px 40px; box-shadow: 0 2px 16px rgba(0,0,0,.08); }
  .bar { max-width: 800px; margin: 16px auto 0; display: flex; gap: 8px; }
  .bar button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #F0B429; background: #F0B429; color: #111; cursor: pointer; }
  .bar button.ghost { background: #fff; color: #111; }
  .bar span { color: #666; align-self: center; }
  .stamp { display: flex; justify-content: space-between; font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: .06em; border-bottom: 2px solid #111; padding-bottom: 6px; }
  h1 { font-size: 18px; margin: 14px 0 2px; }
  .gid { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .disclaimer { background: #fff7e6; border-left: 3px solid #b54708; padding: 7px 10px; margin: 12px 0; font-size: 10.5px; }
  h2 { font-size: 12.5px; margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #ccc; }
  table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  th, td { border: 1px solid #d0d4da; padding: 3px 6px; text-align: left; vertical-align: top; }
  th { background: #f2f4f7; font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid #d0d4da; }
  .kv div { padding: 5px 8px; border-right: 1px solid #d0d4da; border-bottom: 1px solid #d0d4da; }
  .kv small { display: block; color: #666; font-size: 9.5px; }
  .kv b { font-variant-numeric: tabular-nums; }
  .role { font-size: 13px; font-weight: 700; }
  ul { margin: 4px 0; padding-left: 18px; }
  .ai { white-space: pre-wrap; background: #f4f6fb; padding: 8px 10px; border-radius: 4px; }
  .sign { margin-top: 24px; font-size: 10px; color: #555; border-top: 1px solid #ccc; padding-top: 6px; }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheet { box-shadow: none; margin: 0; padding: 0; max-width: none; }
    h2 { break-after: avoid; }
    tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="bar">
  <button id="btn-print">Печать / Сохранить в PDF</button>
  <button class="ghost" id="btn-ai">Добавить AI-справку</button>
  <span id="status"></span>
</div>
<div class="sheet" id="doc">Загрузка…</div>

<script src="net.js"></script>
<script src="report.js"></script>
</body>
</html>
